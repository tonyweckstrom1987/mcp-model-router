# mcp-model-router - example configuration
#
# Copy this file to config.yaml and edit it as needed.
# The file holds no secrets: keys are read from environment variables at
# startup through ${VARIABLE} references. The ${VARIABLE:-default} form sets a
# default value when the variable is not set.

server:
  name: mcp-model-router
  version: "0.2.0"

# The OpenAI-compatible API that every model call goes through.
# Point it at a LiteLLM proxy (recommended) or directly at OpenRouter.
# There are never direct Anthropic calls - the router talks only to this one
# OpenAI-compatible API.
#
# provider.kind tells how the model IDs in the tasks section below are
# interpreted:
#   - "litellm" (default): baseUrl points at a LiteLLM proxy. The model ID is
#     sent as is, e.g. "openrouter/deepseek/deepseek-v4.1-flash"
#     - the "openrouter/" prefix is LiteLLM's own way of saying that the
#     request is routed through OpenRouter.
#   - "openrouter": baseUrl points directly at OpenRouter
#     (https://openrouter.ai/api/v1). OpenRouter's own API does not know the
#     "openrouter/" prefix, so the router strips it automatically before the
#     call (see src/lib/modelId.ts). You can therefore always write the model
#     IDs in the tasks section in the same "openrouter/vendor/model" form,
#     whichever API is used, and the config stays portable between LiteLLM
#     and direct OpenRouter.
provider:
  baseUrl: ${LLM_BASE_URL:-http://localhost:4000}
  apiKey: ${LLM_API_KEY:-}
  timeoutMs: 60000
  kind: ${LLM_PROVIDER_KIND:-litellm} # litellm | openrouter

# Task type -> model. Each task type can define a fallback model that is used
# if the primary model fails. The model IDs below are examples - check the
# exact, current IDs in your own LiteLLM or OpenRouter model list (the
# list_models tool shows what your server offers).
tasks:
  general:
    model: openrouter/deepseek/deepseek-v4.1-flash
    fallbackModel: openrouter/qwen/qwen3-flash
    systemPrompt: "You are a helpful general-purpose assistant."

  code:
    model: openrouter/qwen/qwen3-coder
    fallbackModel: openrouter/deepseek/deepseek-v4.1-flash
    systemPrompt: "You are an experienced software developer. Answer precisely and justify your solutions briefly."

  writing:
    model: openrouter/anthropic/claude-3.5-sonnet
    fallbackModel: openrouter/openai/gpt-4o-mini
    systemPrompt: "You are a skilled writer and editor."

  orchestration:
    model: openrouter/openai/gpt-4o
    fallbackModel: openrouter/anthropic/claude-3.5-sonnet
    systemPrompt: "You orchestrate agents: split the task into parts and delegate clearly."
    # Optional per-task-type timeout (ms) that overrides provider.timeoutMs
    # for this task type only. Useful e.g. for reasoning models, which can
    # take longer on splitting/orchestration tasks than the provider-level
    # default timeout (60000 ms) allows.
    timeoutMs: 120000

# Usage and budget - no bookkeeping of its own, read straight from the
# LiteLLM or OpenRouter API.
usage:
  provider: litellm # litellm | openrouter
  baseUrl: ${USAGE_BASE_URL:-http://localhost:4000}
  apiKey: ${USAGE_API_KEY:-}
  # timeoutMs: 15000 # usage API timeout (default 15 s)

# Settings for the run_eval tool.
eval:
  judge:
    enabled: false
    # Note: pick a judge model that differs from the models run_eval
    # evaluates. A model typically favours its own answer style, so using
    # the same model as judge would bias the scores in its own favour.
    model: openrouter/openai/gpt-4o-mini
    systemPrompt: "You are a strict evaluator. Rate the quality of the answer on a scale of 1-5 and reply with the number only."
    # max_tokens for the judge call (default 64). Raise it if the judge is a reasoning model.
    # maxTokens: 64
  # How many (model, prompt) calls run_eval runs at the same time.
  # Default 4. Raises throughput on large prompt sets, because the calls
  # mostly wait for the network - but too large a value can overload the
  # LiteLLM proxy or hit OpenRouter's rate limits.
  concurrency: 4
  # By default run_eval allows only the models in the tasks section (model,
  # fallbackModel). Add other models to compare here:
  # allowedModels: [openrouter/anthropic/claude-haiku-5-5]
  # Optional price list in $ per million tokens for the eval report's cost
  # estimate (LiteLLM/OpenRouter already show the actual spend - this is
  # only for comparison inside an eval run).
  pricing:
    openrouter/deepseek/deepseek-v4.1-flash:
      inputPerMillionUsd: 0.2
      outputPerMillionUsd: 0.8
    openrouter/qwen/qwen3-coder:
      inputPerMillionUsd: 0.3
      outputPerMillionUsd: 1.2
    openrouter/anthropic/claude-3.5-sonnet:
      inputPerMillionUsd: 3.0
      outputPerMillionUsd: 15.0

# SQLite only for the call log and eval results - no usage bookkeeping.
database:
  path: ${DB_PATH:-./data/mcp-model-router.sqlite}

      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # better-sqlite3 13: npm ci kaantaa natiivimoduulin, mika vaatii
      # Visual Studio Build Toolsin Windowsissa. Suuret versiohypyt ohitetaan.
      - dependency-name: "better-sqlite3"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Aseta Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testit
        run: npm test

      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      # evalkit-Action asettaa Node 24:n, joten se ajetaan viimeisenä ja vain Node 24 -rivillä (matriisi pysyy koskemattomana).
      - name: Tarkista eval-prompt-tiedostot (evalkit-Action, ei verkkokutsuja)
        if: matrix.node-version == 24
        uses: tonyweckstrom1987/evalkit@29262f88e61448c8adfc6beaf26e745e844c05c5
        with:
          mode: validate
          eval-set: examples/eval-prompts.example.json examples/eval-prompts.fi.json

      - name: Toista tallennetut mallivastaukset ja vertaa baselineen (evalkit-Action, ei verkkokutsuja)
        if: matrix.node-version == 24
        uses: tonyweckstrom1987/evalkit@29262f88e61448c8adfc6beaf26e745e844c05c5
        with:
          eval-set: examples/eval-prompts.fi.json
          models: deepseek-flash
          base-url: https://litellm.example/v1
          max-tokens: "2048"
          baseline: test/cassettes/fi.baseline.json
          cassette: test/cassettes/fi.json

      # Oma tyokalu tyossa: mcp-doctor kaynnistaa palvelimen stdio-tilassa, tarkistaa kattelyn ja tyokalujen skeemat
      # ja ajaa savuajon (vain verkottomat kutsut; virhepolut expectError). Node 24 -rivi, koska Action asettaa Node 24:n.
      - name: MCP-terveystarkastus (mcp-doctor-Action)
        if: matrix.node-version == 24
        uses: tonyweckstrom1987/mcp-doctor@6a5f09575dcda006cd661a9906278b42f8ea336e # v0.3.0
        env:
          CONFIG_PATH: ${{ github.workspace }}/config.example.yaml
        with:
          command: node dist/index.js
          smoke: test/mcp-doctor/smoke.json
          strict: "true"
          env-names: CONFIG_PATH
